<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>飞牛音乐 - 服务器设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #2a1a4a 0%, #14101f 55%, #0b0a12 100%);
      color: #f2f2f7;
      overflow: hidden;
    }
    /* 无边框窗口顶部拖拽条：高度与原生覆盖层按钮一致(36px) */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      -webkit-app-region: drag;
      z-index: 100;
    }
    .close-btn {
      position: fixed;
      top: 8px;
      right: 10px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
      z-index: 101;
      cursor: pointer;
      color: #8a8a96;
      background: transparent;
      border: none;
      border-radius: 4px;
      transition: color 0.15s, opacity 0.15s;
      opacity: 0.7;
    }
    .close-btn:hover {
      color: #e8e8f0;
      background: transparent;
      opacity: 1;
    }
    .close-btn svg {
      width: 11px;
      height: 11px;
      display: block;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      -webkit-app-region: no-drag;
    }
    .card {
      width: 480px;
      max-width: 90vw;
      padding: 48px 44px 40px;
      background: rgba(28, 22, 46, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    /* 矮窗口：多级压缩间距与 logo，无滚动条也能一屏放下（窗口最小高度 600px） */
    @media (max-height: 780px) {
      .card { padding: 28px 44px 24px; }
      .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 14px; }
      h1 { font-size: 22px; }
      .sub { margin-bottom: 18px; }
      .version, .update-tip { margin-bottom: 18px; }
      .field { margin-bottom: 12px; }
      .hint { margin-top: 14px; }
    }
    @media (max-height: 660px) {
      .card { padding: 18px 40px 14px; }
      .logo { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 8px; }
      h1 { font-size: 18px; margin-bottom: 4px; }
      .sub { font-size: 12px; margin-bottom: 10px; }
      .version, .update-tip { font-size: 11px; margin-bottom: 10px; }
      .field { margin-bottom: 8px; }
      .field label { font-size: 12px; margin-bottom: 4px; }
      input { padding: 9px 12px; font-size: 14px; }
      .btn { padding: 10px; font-size: 14px; }
      .msg { min-height: 16px; margin-top: 8px; font-size: 12px; }
      .hint { margin-top: 8px; font-size: 11px; }
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, #b06ab3, #4568dc);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(176, 106, 179, 0.45);
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      color: #a89fc4;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .version {
      font-size: 12px;
      color: #6f6889;
      margin-top: -22px;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }
    .update-tip {
      font-size: 12px;
      color: #8a9bf0;
      margin-top: -22px;
      margin-bottom: 30px;
    }
    .update-tip a {
      color: #8a9bf0;
      text-decoration: none;
    }
    .update-tip a:hover { text-decoration: underline; }
    .field {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #c8c0e0;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: #6f6889; }
    input:focus {
      border-color: #b06ab3;
      background: rgba(255, 255, 255, 0.1);
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #b06ab3, #4568dc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: #ff8a8a;
    }
    .hint {
      margin: 14px 0 0;
      font-size: 12px;
      color: #6f6889;
      line-height: 1.5;
      text-align: center;
    }
    .hint a {
      color: #8a9bf0;
      text-decoration: none;
      word-break: break-all;
    }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="close-btn" id="close-btn" title="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <img src="build/icon.png" alt="logo" onerror="this.style.display='none'" />
      </div>
      <h1>飞牛音乐</h1>
      <p class="sub">请输入音乐服务器地址以继续<br />首次使用需要配置一次，之后将自动连接</p>
      <p class="version" id="app-version">v-</p>
      <p class="update-tip" id="update-tip" style="display:none;">
        <a href="#" id="update-link" target="_blank" rel="noopener">发现新版本，点击前往下载</a>
      </p>

      <form id="form">
        <div class="field">
          <label for="url">服务器地址</label>
          <input id="url" type="text" autofocus autocomplete="off"
                 placeholder="IP / 网址 / fnid（如 your-fnid）" spellcheck="false" />
        </div>
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" type="text" autocomplete="off" spellcheck="false"
                 placeholder="登录失效时自动填入" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="off"
                 placeholder="登录失效时自动填入" />
        </div>
        <div class="field">
          <label for="accesscode">访问码（选填）</label>
          <input id="accesscode" type="password" autocomplete="off"
                 placeholder="服务器要求输入访问码时自动填入" />
        </div>
        <button class="btn" id="btn" type="submit">连接</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
    <p class="hint">
      项目地址：<a href="https://github.com/wbc389561407/fnmusic-exe" id="repo-link" target="_blank" rel="noopener">github.com/wbc389561407/fnmusic-exe</a>
    </p>
  </div>

  <script src="setup.js"></script>
</body>
</html>
