<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>桌面歌词</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      --lyric-font-size: 28px;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-app-region: drag;
      cursor: move;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.01);
    }
    #container.locked {
      -webkit-app-region: no-drag;
      cursor: default;
    }
    .lyric-line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      font-size: var(--lyric-font-size, 28px);
      font-weight: 700;
      line-height: 1.6;
      text-align: center;
      text-shadow:
        -1px -1px 0 rgba(0,0,0,0.8),
         1px -1px 0 rgba(0,0,0,0.8),
        -1px  1px 0 rgba(0,0,0,0.8),
         1px  1px 0 rgba(0,0,0,0.8),
         0 2px 6px rgba(0,0,0,0.6);
      letter-spacing: 1px;
      max-width: 100%;
      word-break: break-all;
      transition: color 0.3s, transform 0.3s;
    }
    .lyric-line.current {
      color: #ffe066;
      transform: scale(1.05);
    }
    .lyric-line.other {
      color: #ffffff;
      opacity: 0.55;
    }
    .lyric-line.empty {
      color: #aaa;
      font-size: 22px;
      opacity: 0.5;
    }
    /* 控制条：歌词正下方，hover 整个区域时显示 */
    #toolbar {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #container:hover #toolbar {
      opacity: 1;
    }
    .tb-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ccc;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .tb-btn:hover {
      background: rgba(255,255,255,0.3);
      color: #fff;
    }
    .tb-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="lyric-content">
      <div class="lyric-line empty">桌面歌词已开启</div>
    </div>
    <div id="toolbar">
      <div class="tb-btn" id="btn-lock" title="锁定/解锁拖动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <div class="tb-btn" id="btn-font-down" title="字体缩小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7V5h6v2M7 5v6m0 0l-2.5 5M7 11l2.5 5M14 19h7M17.5 16v6"/>
        </svg>
      </div>
      <div class="tb-btn" id="btn-font-up" title="字体放大">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7V5h6v2M7 5v6m0 0l-2.5 5M7 11l2.5 5M14 19h7M17.5 14v8"/>
        </svg>
      </div>
      <div class="tb-btn" id="btn-prev" title="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </div>
      <div class="tb-btn" id="btn-play" title="播放/暂停">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="tb-btn" id="btn-next" title="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </div>
      <div class="tb-btn" id="btn-close" title="关闭桌面歌词">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="desktop-lyric.js"></script>
</body>
</html>
